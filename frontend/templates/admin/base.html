<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} · Attendance</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="admin">
    <aside class="sidebar">
      <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></symbol>
        <symbol id="icon-student" viewBox="0 0 24 24"><path d="m2 10 10-5 10 5-10 5-10-5Z"/><path d="M6 12v5c3.5 3 8.5 3 12 0v-5M22 10v6"/></symbol>
        <symbol id="icon-teacher" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/><path d="M9 7h7M9 11h7"/></symbol>
        <symbol id="icon-staff" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/></symbol>
        <symbol id="icon-employee" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18M10 12v2h4v-2"/></symbol>
        <symbol id="icon-enroll" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M19 8v6M16 11h6"/></symbol>
        <symbol id="icon-logs" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
        <symbol id="icon-classes" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></symbol>
        <symbol id="icon-kiosk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M10 8l5 2.5-5 2.5V8Z"/></symbol>
        <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></symbol>
      </svg>
      <div class="sidebar-heading">
        <h2>Control Center</h2>
        <button class="sidebar-toggle" type="button" aria-label="Collapse sidebar" aria-controls="admin-nav" aria-expanded="true" title="Collapse sidebar">
          <svg class="icon toggle-icon" aria-hidden="true"><path d="m14 18-6-6 6-6"/></svg>
        </button>
      </div>
      <nav class="nav" id="admin-nav" aria-label="Administration">
        <a href="/admin" aria-label="Dashboard" data-tooltip="Dashboard" title="Dashboard" class="{{ 'active' if active == 'dashboard' else '' }}" {% if active == 'dashboard' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-dashboard"/></svg><span class="nav-label">Dashboard</span></a>
        <a href="/students" aria-label="Students" data-tooltip="Students" title="Students" class="{{ 'active' if nav_active == 'student' else '' }}" {% if nav_active == 'student' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-student"/></svg><span class="nav-label">Students</span></a>
        <a href="/teachers" aria-label="Teachers" data-tooltip="Teachers" title="Teachers" class="{{ 'active' if nav_active == 'teacher' else '' }}" {% if nav_active == 'teacher' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-teacher"/></svg><span class="nav-label">Teachers</span></a>
        <a href="/staff" aria-label="Staff" data-tooltip="Staff" title="Staff" class="{{ 'active' if nav_active == 'staff' else '' }}" {% if nav_active == 'staff' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-staff"/></svg><span class="nav-label">Staff</span></a>
        <a href="/employees" aria-label="Employees" data-tooltip="Employees" title="Employees" class="{{ 'active' if nav_active == 'employee' else '' }}" {% if nav_active == 'employee' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-employee"/></svg><span class="nav-label">Employees</span></a>
        <a href="/students/add" aria-label="Enroll a student" data-tooltip="Enroll a student" title="Enroll a student"><svg class="icon" aria-hidden="true"><use href="#icon-enroll"/></svg><span class="nav-label">Enroll a student</span></a>
        <a href="/teachers/add" aria-label="Enroll a teacher" data-tooltip="Enroll a teacher" title="Enroll a teacher"><svg class="icon" aria-hidden="true"><use href="#icon-enroll"/></svg><span class="nav-label">Enroll a teacher</span></a>
        <a href="/admin/logs" aria-label="Attendance logs" data-tooltip="Attendance logs" title="Attendance logs" class="{{ 'active' if active == 'logs' else '' }}" {% if active == 'logs' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-logs"/></svg><span class="nav-label">Attendance logs</span></a>
        <a href="/admin/classes" aria-label="Classes" data-tooltip="Classes" title="Classes" class="{{ 'active' if active == 'classes' else '' }}" {% if active == 'classes' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-classes"/></svg><span class="nav-label">Classes</span></a>
        <a href="/admin/settings" aria-label="Settings" data-tooltip="Settings" title="Settings" class="{{ 'active' if active == 'settings' else '' }}" {% if active == 'settings' %}aria-current="page"{% endif %}><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg><span class="nav-label">Settings</span></a>
        <a href="/kiosk" aria-label="Open kiosk" data-tooltip="Open kiosk" title="Open kiosk"><svg class="icon" aria-hidden="true"><use href="#icon-kiosk"/></svg><span class="nav-label">Open kiosk</span></a>
        <a href="/admin/logout" aria-label="Log out" data-tooltip="Log out" title="Log out"><svg class="icon" aria-hidden="true"><use href="#icon-logout"/></svg><span class="nav-label">Log out</span></a>
      </nav>
    </aside>
    <main class="main" id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/js/admin.js"></script>
  <script src="/static/js/BackupDownload.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
